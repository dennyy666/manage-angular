<nz-card [nzTitle]="extraTemplate">
    <app-table 
        [listOfData]="listOfData"
        [columns]="columns"

        [showPagination]="showPagination"
        [loading]="loading"
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [total]="total"

        [showCheckbox]="showCheckbox"
        [rowKey]="rowKey"
        [isRowDisabled]="isRowDisabled"
        [checkedIds]="selectedIds"

        [actionColumnTemplate]="actionTemplate"
        (pageIndexChange)="onPageIndexChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
        (checkedIdsChange)="onCheckedIdsChange($event)"
        (checkedRowsChange)="onCheckedRowsChange($event)"> 
    </app-table>

    <!-- 状态列模板 -->
    <ng-template #statusTemplate let-item>
        <span [style.color]="item.status === '1' ? 'green' : 'red'">
            {{ item.status === '1' ? '启用' : '禁用' }}
        </span>
    </ng-template>

    <!-- 操作列模板 -->
    <ng-template #actionTemplate let-item>
        <button nz-button nzType="link" (click)="updateHero(item)">编辑</button>
        <nz-divider nzType="vertical"></nz-divider>
        <button nz-button nzType="link" nzDanger (click)="deleteHero(item?.id,item?.name)">删除</button>
    </ng-template>
</nz-card>




<ng-template #extraTemplate>
  <button nz-button nzType="primary" style="margin-right:15px;" (click)="addHero()"><span nz-icon nzType="plus"
      nzTheme="outline"></span>增加</button>
  <button nz-button nzType="primary" nzDanger (click)="batchDelete()"><span nz-icon nzType="delete" nzTheme="outline"></span>批量删除</button>
  <!-- <button nz-button nzType="primary" style="margin-left:15px;" nzDanger (click)="clearAllSelection()">清空选中</button>
  <button nz-button nzType="primary" style="margin-left:15px;" nzDanger (click)="setSomeSelection()">设置选中</button> -->
</ng-template>

<nz-modal [(nzVisible)]="addHeroModal" [nzTitle]="validateForm.value.id?'修改英雄':'添加英雄'" (nzOnCancel)="addHeroCancel()" (nzOnOk)="addHeroOk()">
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="validateForm">
      <nz-form-item>
        <nz-form-label [nzSpan]="7" nzRequired>姓名</nz-form-label>
        <nz-form-control [nzSpan]="12" [nzErrorTip]="nameErrorTpl">
          <input nz-input formControlName="name" placeholder="请输入姓名" />
          <ng-template #nameErrorTpl let-control>
            <ng-container *ngIf="control.hasError('required')">请输入姓名</ng-container>
          </ng-template>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label [nzSpan]="7" nzRequired>手机号</nz-form-label>
        <nz-form-control [nzSpan]="12" [nzErrorTip]="mobileErrorTpl">
          <input nz-input formControlName="mobile" placeholder="请输入手机号" />
          <ng-template #mobileErrorTpl let-control>
            <ng-container *ngIf="control.hasError('required')">请输入手机号</ng-container>
          </ng-template>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label [nzSpan]="7" nzRequired>姓名</nz-form-label>
        <nz-form-control [nzSpan]="12" [nzErrorTip]="roleErrorTpl">
          <nz-select formControlName="role" nzAllowClear nzPlaceHolder="请选择角色">
            <nz-option nzValue="1" nzLabel="剑士"></nz-option>
            <nz-option nzValue="2" nzLabel="射手"></nz-option>
            <nz-option nzValue="3" nzLabel="坦克"></nz-option>
            <nz-option nzValue="4" nzLabel="法师"></nz-option>
          </nz-select>
          <ng-template #roleErrorTpl let-control>
            <ng-container *ngIf="control.hasError('required')">请选择角色</ng-container>
          </ng-template>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label [nzSpan]="7" nzRequired>位置</nz-form-label>
        <nz-form-control [nzSpan]="12" [nzErrorTip]="positionErrorTpl">
          <nz-select formControlName="position" nzAllowClear nzPlaceHolder="请选择位置">
            <nz-option nzValue="1" nzLabel="上单"></nz-option>
            <nz-option nzValue="2" nzLabel="中单"></nz-option>
            <nz-option nzValue="3" nzLabel="打野"></nz-option>
            <nz-option nzValue="4" nzLabel="ADC"></nz-option>
            <nz-option nzValue="5" nzLabel="辅助"></nz-option>
          </nz-select>
          <ng-template #positionErrorTpl let-control>
            <ng-container *ngIf="control.hasError('required')">请选择位置</ng-container>
          </ng-template>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label [nzSpan]="7" nzRequired>备注</nz-form-label>
        <nz-form-control [nzSpan]="12" [nzErrorTip]="remarkErrorTpl">
          <textarea rows="4" formControlName="remark" nz-input maxlength="20"></textarea>
          <ng-template #remarkErrorTpl let-control>
            <ng-container *ngIf="control.hasError('required')">请输入备注</ng-container>
          </ng-template>
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>
