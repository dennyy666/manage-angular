<header class="breadcrumb">
  <div class="left"> 
    <span nz-icon nzTheme="outline" (click)="toggle()"></span>
  </div>
  <div class="right">
    <a nz-dropdown [nzDropdownMenu]="menu" nzPlacement="bottomRight" *ngIf="authService.currentUser$ | async as user">
      <img src="assets/avatar.png">
      <span>{{user.username}}</span>
      <span nz-icon nzType="down" class="menu-down-icon"></span>
    </a>
  </div>
</header>

<nz-dropdown-menu #menu="nzDropdownMenu">
  <ul nz-menu nzSelectable>
    <li nz-menu-item (click)="openGithub()">github地址</li>
    <li nz-menu-item (click)="loginOut()">退出登录</li>
  </ul>
</nz-dropdown-menu>
